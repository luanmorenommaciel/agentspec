[project]
name = "agentspec-spec-composer"
version = "0.1.0"
description = "AgentSpec artifact-creation conductor (the Composer) — prototype"
requires-python = ">=3.12"
# `spec_linter` (required) and `spec_judge` (optional) are the sibling packages under
# tools/. Both are real runtime dependencies of spec_composer, but neither is listed
# below: they have no published packages of their own. They resolve via the
# `spec-compose` wrapper script's PYTHONPATH, or an editable co-install in dev —
# never through pip.
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
spec-compose = "spec_composer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec_composer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
