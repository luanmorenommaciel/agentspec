[project]
name = "agentspec-spec-scorer"
version = "0.1.0"
description = "AgentSpec artifact scoring engine (the Scorer) — prototype"
requires-python = ">=3.12"
# `spec_linter` (the sibling package under tools/spec-linter) is a real runtime
# dependency of spec_scorer, but is deliberately NOT listed below: it has no
# published package of its own. It resolves via the `spec-score` wrapper script's
# PYTHONPATH, or an editable co-install of tools/spec-linter in dev — never
# through pip.
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
spec-scorer = "spec_scorer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec_scorer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
